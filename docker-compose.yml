services:
  api:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: invoice_system
      DB_USER: invoice
      DB_PASSWORD: invoice
      DB_CHARSET: utf8mb4
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:5.7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: invoice_system
      MYSQL_USER: invoice
      MYSQL_PASSWORD: invoice
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data: